name: "Conventional Commits & PR Standards"

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  lint-pr-title:
    name: "Validate PR Title (Conventional Commits)"
    runs-on: ubuntu-latest
    steps:
      - name: "Validate PR Title"
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(\[[A-Z]+-[0-9]+\]\s|[A-Z]+-[0-9]+:\s)?.+$
          subjectPatternError: "PR title subject must describe the change and optionally start with a ticket ID (e.g., 'feat: [GLOB-101] add login' or 'fix(auth): resolve token expiry')."
