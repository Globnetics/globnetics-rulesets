name: "Secret & File Size Guard"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  file-guard:
    name: "Check File Extensions, Paths & Size"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Scan for Restricted Extensions, Sensitive Paths & Large Files"
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          MAX_BYTES=52428800 # 50 MB
          FORBIDDEN_EXTS="pem|key|p12|pfx|pkcs12|kdbx|jks|keystore|ovpn"
          FAILED=0

          echo "Scanning changed files between $BASE_SHA and $HEAD_SHA..."
          CHANGED_FILES=$(git diff --name-only --diff-filter=d "$BASE_SHA..$HEAD_SHA")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files detected."
            exit 0
          fi

          for FILE in $CHANGED_FILES; do
            # 1. Check forbidden extensions (keys, certificates, keystores)
            EXT="${FILE##*.}"
            if [[ "$EXT" =~ ^($FORBIDDEN_EXTS)$ ]]; then
              echo "::error title=Blocked File Extension::File '$FILE' has a restricted extension (.$EXT). Private keys and certificates must never be committed."
              FAILED=1
            fi

            # 2. Check sensitive file paths (.env, secrets, credentials, SSH keys)
            BASENAME=$(basename "$FILE")
            if [[ "$BASENAME" =~ ^\.env ]] || [[ "$FILE" =~ (secrets|credentials)/ ]] || [[ "$BASENAME" =~ ^id_(rsa|ed25519) ]]; then
              echo "::error title=Blocked Sensitive Path::File '$FILE' matches restricted credentials/secret path pattern."
              FAILED=1
            fi

            # 3. Check file size (if file exists in HEAD)
            if [ -f "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE" 2>/dev/null || wc -c < "$FILE")
              if [ "$SIZE" -gt "$MAX_BYTES" ]; then
                echo "::error title=File Exceeds 50MB Limit::File '$FILE' is $SIZE bytes (limit is $MAX_BYTES bytes / 50MB). Large binaries should be stored in Git LFS or artifact storage."
                FAILED=1
              fi
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "Push blocked due to policy violations above. Please remove the flagged files and push again."
            exit 1
          fi
          echo "All file extension, path, and size checks passed."
